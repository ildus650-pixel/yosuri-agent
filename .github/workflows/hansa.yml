name: Hansa Cycle

# Agent Hansa autonomous loop, documented cadence: every 8 hours.
#   GET  /api/agents/feed            what to do next (single source of truth)
#   POST /api/agents/checkin         -> math challenge
#   POST /api/agents/checkin/verify  -> solve it, claim the daily USDC
#   GET  /api/agents/daily-quests    quest bonus progress
#   GET  /api/agents/earnings        balance
#
# The check-in challenge is solved locally by scripts/hansa_cycle.py
# (13/13 on the observed templates before this workflow was committed).
#
# Secrets required: HANSA_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a cycle already ran in the last 8 hours"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hansa-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hansa cycle
        id: cycle
        env:
          HANSA_API_KEY: ${{ secrets.HANSA_API_KEY }}
          HANSA_AGENT_ID: ${{ secrets.HANSA_AGENT_ID }}
          AGENT_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          python3 scripts/hansa_cycle.py > /tmp/report.md 2>/tmp/err.txt
          echo "exit=$?"
          echo "--- report ---"
          cat /tmp/report.md
          if [ -s /tmp/err.txt ]; then echo "--- stderr ---"; tail -20 /tmp/err.txt; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: FluxA wallet (operator authorization link)
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "" >> /tmp/report.md
          echo "*- FluxA wallet*" >> /tmp/report.md
          W=/tmp/wallet.txt
          timeout 120 npx --yes @fluxa-pay/fluxa-wallet@latest status > "$W" 2>&1 || true
          if ! grep -qiE 'initialized|already|address' "$W"; then
            timeout 180 npx --yes @fluxa-pay/fluxa-wallet@latest init \
              --name "${{ github.event.repository.name }}" \
              --client "github-actions" >> "$W" 2>&1 || true
          fi
          timeout 120 npx --yes @fluxa-pay/fluxa-wallet@latest link-wallet >> "$W" 2>&1 || true
          grep -oE 'https?://[^ "'"'"'<>]+' "$W" | sort -u | head -4 | while read -r u; do
            echo "  - OPERATOR ACTION: $u" >> /tmp/report.md
          done
          sed -n '1,12p' "$W" | sed 's/^/  /' >> /tmp/report.md

      - name: Send report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/notify.py /tmp/report.md "${{ github.event.repository.name }} · Hansa" || true

      - name: Commit report
        if: always()
        run: |
          set -uo pipefail
          mkdir -p hansa memory
          cp /tmp/report.md "hansa/$(date -u +%Y-%m-%dT%H).md" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hansa/ memory/ 2>/dev/null || true
          git commit -q -m "hansa: cycle $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push -q || echo "push skipped"
