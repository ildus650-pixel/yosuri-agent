name: Hansa Cycle

# Agent Hansa autonomous loop, documented cadence: every 8 hours.
#   GET  /api/agents/feed            what to do next (single source of truth)
#   POST /api/agents/checkin         -> math challenge
#   POST /api/agents/checkin/verify  -> solve it, claim the daily USDC
#   GET  /api/agents/daily-quests    quest bonus progress
#   GET  /api/agents/earnings        balance
#
# Step order matters: the wallet step runs BEFORE the cycle, because the cycle
# registers the FluxA agent id with Hansa. Running it afterwards means every
# cycle registers the id one run late.
#
# Repository variables:
#   HANSA_WALLET_LINK = "1"  -> also run link-wallet (ties the agent to the
#                               operator's wallet). Hansa allows ONE agent per
#                               wallet, so leave this off for a fleet.
#   HANSA_EMAIL_BIND  = "1"  -> claim the $0.50 verified-email bonus
#
# Secrets required: HANSA_API_KEY, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID

on:
  schedule:
    - cron: "0 */8 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if a cycle already ran in the last 8 hours"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: hansa-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: FluxA wallet
        continue-on-error: true
        run: |
          set -uo pipefail
          ID=memory/fluxa-agent-id.txt
          mkdir -p memory
          REG=""
          # Registering straight against the documented FluxA Agent ID API.
          # The npx CLI produced ids that FluxA itself answered 404 for, and it
          # only ever printed an add-agent URL whose approval ties the agent to
          # the operator's single wallet - which Hansa rejects with 409 for the
          # second agent onward. One API call per agent gives each its own id.
          # Guarded: a second registration would mint a new id and orphan the
          # wallet the previous one points at.
          if [ ! -s "$ID" ] || ! grep -qE '^[0-9a-fA-F-]{36}$' "$ID"; then
            REG=$(curl -sS --max-time 60 -X POST https://agentid.fluxapay.xyz/register \
              -H "Content-Type: application/json" \
              -d "{\"agent_name\":\"${{ github.event.repository.name }}\",\"client_info\":\"hansa-cycle/github-actions\"}" \
              2>/dev/null || true)
            FOUND=$(printf '%s' "$REG" | grep -oE '"agent_id"[[:space:]]*:[[:space:]]*"[0-9a-fA-F-]{36}"' \
              | grep -oE '[0-9a-fA-F-]{36}' | head -1 || true)
            printf '%s' "${FOUND:-none}" > "$ID"
          else
            FOUND=$(cat "$ID")
          fi
          {
            echo "*- FluxA wallet*"
            echo "  - registered agent id: ${FOUND:-none}"
            echo "  - token: held back on purpose (one-time secret; this repo is public)"
            if [ -z "${FOUND:-}" ]; then
              echo "  - register reply: $(printf '%s' "$REG" | sed -E 's/"(token|jwt)":"[^"]*"/"\\1":"REDACTED"/g' | head -c 300)"
            fi
            echo "  - WALLET_LINK note: approval-based linking is skipped; it "
            echo "    collapses every agent onto one wallet, which Hansa rejects."
          } > /tmp/wallet.md
          cat /tmp/wallet.md

      - name: Email bonus (one claim per agent)
        if: ${{ vars.HANSA_EMAIL_BIND == '1' }}
        continue-on-error: true
        env:
          HANSA_API_KEY: ${{ secrets.HANSA_API_KEY }}
          AGENT_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          python3 scripts/email_bind.py > /tmp/email.md 2>&1 || true
          cat /tmp/email.md

      - name: Run Hansa cycle
        id: cycle
        env:
          HANSA_API_KEY: ${{ secrets.HANSA_API_KEY }}
          HANSA_AGENT_ID: ${{ secrets.HANSA_AGENT_ID }}
          AGENT_NAME: ${{ github.event.repository.name }}
        run: |
          set -uo pipefail
          python3 scripts/hansa_cycle.py > /tmp/report.md 2>/tmp/err.txt
          echo "exit=$?"
          cat /tmp/report.md
          if [ -s /tmp/err.txt ]; then echo "--- stderr ---"; tail -20 /tmp/err.txt; fi

      - name: Assemble report
        if: always()
        run: |
          set -uo pipefail
          { cat /tmp/report.md 2>/dev/null || echo "(no cycle report)"; \
            cat /tmp/email.md 2>/dev/null || true; \
            cat /tmp/wallet.md 2>/dev/null || true; } > /tmp/full.md
          mv /tmp/full.md /tmp/report.md

      - name: Send report to Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 scripts/notify.py /tmp/report.md "${{ github.event.repository.name }} · Hansa" || true

      - name: Commit report
        if: always()
        run: |
          set -uo pipefail
          mkdir -p hansa memory
          cp /tmp/report.md "hansa/$(date -u +%Y-%m-%dT%H).md" 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hansa/ memory/ 2>/dev/null || true
          git commit -q -m "hansa: cycle $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git pull --rebase -q origin "${GITHUB_REF_NAME}" || true
          git push -q || echo "push skipped"
